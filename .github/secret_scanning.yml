# packages/llm/llm-pi-ai/src/antigravity.ts embeds the Antigravity IDE's public
# installed-app OAuth client pair (client id and client secret). OAuth 2.0
# installed apps cannot hold secrets — the pair identifies the application to
# Google, not a user, and the requested scopes are bound to that client's
# project, so every client in this ecosystem publishes the same pair.
paths_allowed:
  - "packages/llm/llm-pi-ai/src/antigravity.ts"
